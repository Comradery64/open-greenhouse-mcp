name: Publish to PyPI

# Manual only. This fired on every published release, and the release workflow
# publishes one — so cutting a bundle release chained into a PyPI upload of
# "open-greenhouse-mcp", a project owned upstream by Ben Monopoli. It could never
# have succeeded (no PYPI_API_TOKEN is configured, and the name is not ours), so
# the only effect was a failed job on every release, which trains people to ignore
# red builds.
#
# Before using this: rename the distribution in pyproject.toml to a name you own,
# and add a PYPI_API_TOKEN secret. Then consider restoring the release trigger.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build
        run: python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
